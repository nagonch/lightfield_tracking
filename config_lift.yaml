# Real LiFT dataset overrides — deep-merged over config.yaml by config.py when
# CONFIG_OVERRIDES=config_lift.yaml (main_lift.py sets this automatically).
# Only keys that differ from the synthetic config belong here.

tracking:
  # The real capture is 1280x720 (vs 640x480 synthetic). At the historical
  # short-edge-400 LoFTR input the object shrinks to ~140 px and the coarse
  # backbone drifts 1-2°/frame on textured scenes (SIFT+PnP at full res
  # doesn't). Picked by the resize sweep (sweeps_resize.log): best on 2/3
  # diagnostic scenes, ~1-2° mean rotation gain with LF depth.
  loftr_resize: 720
  # Tightened from 0.05 (BundleSDF's value, sized for noisy synthetic depth):
  # LF plane-sweep depth is clean enough for a 20mm gate (sweeps_inlier.log;
  # 10mm was better still on textured scenes but regressed shiny_box).
  ransac_inlier_dist: 0.02

# Refine as a pure per-frame overlay (paper design decision 1): on real data,
# feeding the refined pose forward compounds its small translation bias
# (ADD 0.787->0.768, ATE 19.5->22.5mm measured); the overlay keeps the coarse
# backbone as anchor and reports the per-frame correction.
refine_feed_forward: false

# Refine sweep (sweeps_refine.log): num_iters/lambda_depth/lr_rot variants all
# moved results <0.2° (below LoFTR run-to-run noise), so the refine keeps the
# synthetic-tuned defaults from config.yaml. Alpha stays ESTIMATED: pinning the
# variance-ratio optimum (0.8, experiments/tune_separation_lift.py) helps
# separation on the jug but forces 20% ICP into the blend on a rotationally
# symmetric object — net negative (17.5 vs 17.2 deg).
